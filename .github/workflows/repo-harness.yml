name: 仓库 harness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: 仓库与 OpenSpec 校验
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: 安装固定版本的 OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.6.0
      - name: 运行快速 harness 校验
        run: ./scripts/repo-harness validate quick

  firmware-host:
    name: 固件 host 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 运行 host 测试
        run: ./scripts/repo-harness validate firmware-host

  server:
    name: 服务端测试与构建
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 运行服务端校验
        run: ./scripts/repo-harness validate server
